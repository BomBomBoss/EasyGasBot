version: "3.8"
services:
  telegrambot:
    container_name: telegram-bot
    image: my-bot
    environment:
    - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      - rabbitmq
  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3.11.0-management
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./rabbitmq_data:/var/lib/rabbitmq
    environment:
      - "RABBITMQ_DEFAULT_USER=vlad"
      - "RABBITMQ_DEFAULT_PASS=password"
  gasstationnode:
    container_name: gas-stations-node
    image: gas-station-node
    environment:
      - "SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/bossbotdb"
      - "SPRING_DATASOURCE_USERNAME=admin"
      - "SPRING_DATASOURCE_PASSWORD=admin"
      - "SPRING_RABBITMQ_HOST=rabbitmq"
    depends_on:
      - rabbitmq
  postgres:
    container_name: easy-gas-db
    image: postgres:14.5
    ports:
      - "5432:5432"
    volumes:
      - ./local_psql_data:/var/lib/postgresql/data
    environment:
      - "POSTGRES_USER=admin"
      - "POSTGRES_PASSWORD=admin"
      - "POSTGRES_DB=bossbotdb"

