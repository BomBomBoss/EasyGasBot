databaseChangeLog:
  - changeSet:
      id: telegram_user_table
      author: Vlad
      changes:
        - createTable:
            tableName: telegram_user
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: first_name
                  type: varchar
              - column:
                  name: language_code
                  type: varchar
        - createIndex:
            indexName: index_in_user_id
            tableName: telegram_user
            columns:
              - column:
                  name: user_id


