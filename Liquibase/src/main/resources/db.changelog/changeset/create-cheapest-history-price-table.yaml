databaseChangeLog:
  - changeSet:
      id: cheapest-history-price-table
      author: Vlad
      changes:
        - createTable:
            tableName: cheapest_history_price
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: brand_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: brand_id
                    references: gas_stations_brands(id)
              - column:
                  name: gas_type_id
                  type: bigint
              - column:
                  name: price
                  type: varchar
              - column:
                  name: date
                  type: date

