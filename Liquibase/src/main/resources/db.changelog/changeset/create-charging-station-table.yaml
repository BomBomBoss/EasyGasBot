databaseChangeLog:
  - changeSet:
      id: create_charging_station_table
      author: Vlad
      changes:
        - createTable:
            tableName: charging_station
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: external_id
                  type: varchar
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_charging_station_external_id
              - column:
                  name: name
                  type: varchar
                  constraints:
                    nullable: false
              - column:
                  name: address
                  type: varchar
                  constraints:
                    nullable: false
              - column:
                  name: district
                  type: varchar
              - column:
                  name: latitude
                  type: numeric
                  constraints:
                    nullable: false
              - column:
                  name: longitude
                  type: numeric
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar
                  constraints:
                    nullable: false
              - column:
                  name: is_partner
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: is_always_open
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: availability
                  type: varchar
              - column:
                  name: is_active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: last_synced_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  constraints:
                    nullable: false
